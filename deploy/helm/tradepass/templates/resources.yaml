{
  "apiVersion": "apps/v1",
  "kind": "StatefulSet",
  "metadata": {
    "name": "file",
    "namespace": {{ .Release.Namespace | quote }},
    "labels": {
      "app.kubernetes.io/name": "tradepass",
      "app.kubernetes.io/component": "file"
    }
  },
  "spec": {
    "replicas": {{ index .Values.replicas "file" }},
    "revisionHistoryLimit": 5,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "tradepass",
        "app.kubernetes.io/component": "file"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "tradepass",
          "app.kubernetes.io/component": "file"
        },
        "annotations": {
          "tradepass.io/revision": {{ .Values.revision | quote }},
          "prometheus.io/scrape": "true",
          "prometheus.io/port": "8081",
          "prometheus.io/path": "/actuator/prometheus",
          "tradepass.io/config": {{ printf "%s:%s:%s" (.Values.runtime | toJson) (.Values.datacenterId | toString) .Values.contractProfiles | sha256sum | quote }},
          "tradepass.io/secrets": {{ .Values.secretRevision | quote }}
        }
      },
      "spec": {
        "serviceAccountName": "tradepass-runtime",
        "automountServiceAccountToken": false,
        "imagePullSecrets": [
          {
            "name": "tradepass-registry"
          }
        ],
        "terminationGracePeriodSeconds": 60,
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 10001,
          "runAsGroup": 10001,
          "fsGroup": 10001,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "file",
            "image": {{ index .Values.images "file" | quote }},
            "imagePullPolicy": "IfNotPresent",
            "env": [
              {
                "name": "JAVA_OPTS",
                "value": "-Xms64m -Xmx384m -XX:ActiveProcessorCount=2"
              },
              {
                "name": "SW_AGENT_NAME",
                "value": "tradepass-file"
              },
              {
                "name": "TRADEPASS_IDS_WORKER_BASE",
                "value": "24"
              },
              {
                "name": "TRADEPASS_POD_NAME",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "metadata.name"
                  }
                }
              }
            ],
            "envFrom": [
              {
                "configMapRef": {
                  "name": {{ printf "tradepass-runtime-%s" (.Values.runtime | toJson | sha256sum | trunc 12) | quote }}
                }
              },
              {
                "secretRef": {
                  "name": "tradepass-internal"
                }
              },
              {
                "secretRef": {
                  "name": "tradepass-file"
                }
              }
            ],
            "ports": [
              {
                "name": "http",
                "containerPort": 8080
              },
              {
                "name": "management",
                "containerPort": 8081
              }
            ],
            "resources": {
              "requests": {
                "cpu": "200m",
                "memory": "256Mi"
              },
              "limits": {
                "cpu": "2",
                "memory": "1Gi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "volumeMounts": [
              {
                "name": "tmp",
                "mountPath": "/tmp"
              }
            ],
            "startupProbe": {
              "httpGet": {
                "path": "/actuator/health/liveness",
                "port": "management"
              },
              "periodSeconds": 5,
              "failureThreshold": 60,
              "timeoutSeconds": 3
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/actuator/health/liveness",
                "port": "management"
              },
              "periodSeconds": 15,
              "failureThreshold": 3,
              "timeoutSeconds": 3
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/actuator/health/readiness",
                "port": "management"
              },
              "periodSeconds": 5,
              "failureThreshold": 3,
              "timeoutSeconds": 3
            }
          }
        ],
        "volumes": [
          {
            "name": "tmp",
            "emptyDir": {
              "sizeLimit": "256Mi"
            }
          }
        ]
      }
    },
    "serviceName": "file-pods",
    "podManagementPolicy": "Parallel",
    "updateStrategy": {
      "type": "RollingUpdate"
    }
  }
}
