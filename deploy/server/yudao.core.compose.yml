# 应用配置只从 Nacos 读取；不再使用 --env-file .env.core。
# 首次执行 configure-core-nacos.py 生成私有 Nacos 连接文件。
name: tradepass-core
services:
  identity:
    pull_policy: never
    restart: 'no'
    mem_limit: 416m
    user: 0:0
    network_mode: host
    volumes:
    - type: bind
      source: ${TRADEPASS_LOG_DIRECTORY:-/docker/tradepass/logs}
      target: /root/logs
    - type: bind
      source: ./.runtime/nacos/bootstrap.yml
      target: /app/nacos-bootstrap.yml
      read_only: true
      bind:
        create_host_path: false
    image: tradepass-identity:${TRADEPASS_IMAGE_TAG:-local}
    environment:
      TZ: Asia/Shanghai
      TRADEPASS_TRACING_ENABLED: 'false'
      MALLOC_ARENA_MAX: 2
      JAVA_OPTS: -Xms64m -Xmx128m -XX:MaxMetaspaceSize=128m -XX:MaxDirectMemorySize=32m
        -XX:ReservedCodeCacheSize=32m -XX:+UseSerialGC -XX:ActiveProcessorCount=1
      SERVER_ADDRESS: 127.0.0.1
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 45s
      TRADEPASS_DEV_ENABLED: 'false'
      TRADEPASS_DEMO_DATA_ENABLED: 'false'
      TRADEPASS_EXPERIENCE_TEST_ACCOUNTS_ENABLED: 'false'
      SEATA_ENABLED: 'false'
      SERVER_PORT: 1111
      MANAGEMENT_PORT: 11111
      LOGGING_FILE_NAME: /root/logs/tradepass-identity.log
      TRADEPASS_IDS_WORKER_ID: 1
      SPRING_PROFILES_ACTIVE: observability,filelog,core
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/nacos-bootstrap.yml
  business:
    pull_policy: never
    restart: 'no'
    mem_limit: 704m
    user: 0:0
    network_mode: host
    volumes:
    - type: bind
      source: ${TRADEPASS_LOG_DIRECTORY:-/docker/tradepass/logs}
      target: /root/logs
    - type: bind
      source: ./.runtime/nacos/bootstrap.yml
      target: /app/nacos-bootstrap.yml
      read_only: true
      bind:
        create_host_path: false
    depends_on:
      identity:
        condition: service_healthy
    image: tradepass-business:${TRADEPASS_IMAGE_TAG:-local}
    environment:
      TZ: Asia/Shanghai
      TRADEPASS_TRACING_ENABLED: 'false'
      MALLOC_ARENA_MAX: 2
      JAVA_OPTS: -Xms64m -Xmx256m -XX:MaxMetaspaceSize=160m -XX:MaxDirectMemorySize=32m
        -XX:ReservedCodeCacheSize=48m -XX:+UseSerialGC -XX:ActiveProcessorCount=1
      SERVER_ADDRESS: 127.0.0.1
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 45s
      TRADEPASS_DEV_ENABLED: 'false'
      TRADEPASS_DEMO_DATA_ENABLED: 'false'
      TRADEPASS_EXPERIENCE_TEST_ACCOUNTS_ENABLED: 'false'
      SEATA_ENABLED: 'false'
      SERVER_PORT: 1112
      MANAGEMENT_PORT: 11112
      LOGGING_FILE_NAME: /root/logs/tradepass-business.log
      TRADEPASS_IDS_WORKER_ID: 2
      SPRING_PROFILES_ACTIVE: observability,filelog,core,messaging
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/nacos-bootstrap.yml
  gateway:
    pull_policy: never
    restart: 'no'
    mem_limit: 320m
    user: 0:0
    network_mode: host
    volumes:
    - type: bind
      source: ${TRADEPASS_LOG_DIRECTORY:-/docker/tradepass/logs}
      target: /root/logs
    - type: bind
      source: ./.runtime/nacos/bootstrap.yml
      target: /app/nacos-bootstrap.yml
      read_only: true
      bind:
        create_host_path: false
    depends_on:
      identity:
        condition: service_healthy
      business:
        condition: service_healthy
    image: tradepass-gateway:${TRADEPASS_IMAGE_TAG:-local}
    environment:
      TZ: Asia/Shanghai
      SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: 1110
      MANAGEMENT_PORT: 10110
      LOGGING_FILE_NAME: /root/logs/tradepass-gateway.log
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 45s
      TRADEPASS_TRACING_ENABLED: 'false'
      MALLOC_ARENA_MAX: 2
      JAVA_OPTS: -Xms64m -Xmx96m -XX:MaxMetaspaceSize=96m -XX:MaxDirectMemorySize=32m
        -XX:ReservedCodeCacheSize=32m -XX:+UseSerialGC -XX:ActiveProcessorCount=1
      SPRING_PROFILES_ACTIVE: observability,filelog,core,gateway-discovery
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/nacos-bootstrap.yml
