name: tradepass-edge
services:
  nginx:
    image: nginx:1.27.4-alpine
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    restart: unless-stopped
    network_mode: host
    mem_limit: 64m
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ${TRADEPASS_TLS_DIRECTORY:?Set the directory containing fullchain.pem and privkey.pem}:/etc/nginx/tls:ro
