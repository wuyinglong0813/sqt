name: tradepass-edge
services:
  nginx:
    image: nginx:1.27.4-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    networks: [tradepass]
    volumes:
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TRADEPASS_TLS_DIRECTORY:?Set the directory containing fullchain.pem and privkey.pem}:/etc/nginx/tls:ro
networks:
  tradepass:
    external: true
    name: ${TRADEPASS_NETWORK_NAME:-tradepass-server}
