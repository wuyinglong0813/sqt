input { beats { port => 5044 } }
filter {
  if [app][@timestamp] { date { match => ["[app][@timestamp]", "ISO8601"] } }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "tradepass-logs-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
}
