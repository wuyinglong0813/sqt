name: Backend release images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: backend-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - run: python3 -m pip install PyYAML
      - name: Verify the complete release before publication
        run: bash scripts/ci/verify.sh
      - name: Registry login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable images
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          export IMAGE_PREFIX="ghcr.io/${REPOSITORY,,}"
          export IMAGE_TAG="${COMMIT}-${RUN_NUMBER}"
          python3 scripts/ci/release.py build
          TRADEPASS_IMAGE_PREFIX="$IMAGE_PREFIX" TRADEPASS_IMAGE_TAG="$IMAGE_TAG" bash scripts/ci/verify-compose.sh
          python3 scripts/ci/release.py publish
          python3 scripts/ci/helm_values.py --release dist/release/release.json --output dist/release/values-staging.yaml
      - uses: actions/upload-artifact@v4
        with: {name: immutable-release, path: dist/release, retention-days: 30}
